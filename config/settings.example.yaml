# mini-quant 全局配置模板。
# 使用：复制为 settings.yaml（同目录）并填入真实值——settings.yaml 已被 .gitignore 排除，不会入库。
# 敏感项（密码）也可用环境变量覆盖：
#   QUANT_DB_HOST / QUANT_DB_PORT / QUANT_DB_USER / QUANT_DB_PASSWORD / QUANT_DB_NAME

# 默认数据源：baostock（免费稳定）或 akshare（免费聚合多源）
# 也可通过 CLI --source 参数临时覆盖
data_source: baostock

database:
  host: 127.0.0.1
  port: 3306
  user: root
  password: ""          # 建议留空，用环境变量 QUANT_DB_PASSWORD
  name: ods

backtest:
  init_cash: 1000000        # 初始资金
  commission_rate: 0.00025  # 佣金 万2.5
  min_commission: 5.0       # 最低佣金 5 元
  stamp_tax: 0.0005        # 印花税（仅卖出， 万5）
  slippage: 0.002           # 滑点 0.2%（千2，按成交价乘）
  price_limit: 0.095        # 涨跌停近似阈值（触及则拒单）

server:
  host: 127.0.0.1
  port: 8000
